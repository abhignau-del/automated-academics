name: Windows app

# Builds the double-click Windows app (no Python or Node needed to run it) and attaches it to the release.
# Runs when a version tag such as v0.4.0 is pushed, or by hand from the Actions tab (the zip is then kept
# as a download on the run instead).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[build]"
      - name: Build
        shell: pwsh
        run: scripts/build-app.ps1
      - name: Smoke test the built app
        run: python scripts/smoke_app.py (Get-ChildItem dist-app/Automated-Academics-*-windows.zip).FullName
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Automated-Academics-windows
          path: dist-app/Automated-Academics-*-windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag (Get-ChildItem dist-app/Automated-Academics-*-windows.zip).FullName --clobber
