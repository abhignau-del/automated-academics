name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t automated-academics .
      - name: Start it and check it answers, with sign-in on and nobody set up yet
        run: |
          docker run -d --name aa -p 8000:8000 automated-academics
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/auth/status | tee /dev/stderr | grep -q '"setup_needed":true'
          curl -fs http://127.0.0.1:8000/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/institutions)" = 401
      - name: Back up and restore as the container's own user (writes to /data, shared mode, first administrator)
        run: |
          set -e
          J=$(mktemp); W=$(mktemp -d)
          curl -fs -c "$J" -H 'Content-Type: application/json' -d '{"username":"root","password":"correct horse battery"}' "http://127.0.0.1:8000/auth/setup" > /dev/null
          curl -fs -b "$J" "http://127.0.0.1:8000/institutions/starter?kind=sample" > "$W/sample.json"
          curl -fs -b "$J" -H 'Content-Type: application/json' -d @"$W/sample.json" "http://127.0.0.1:8000/institutions" > /dev/null
          curl -fs -b "$J" -o "$W/backup.db" "http://127.0.0.1:8000/admin/backup"
          head -c 15 "$W/backup.db" | grep -q 'SQLite format 3'
          curl -fs -b "$J" -X POST -H 'Content-Type: application/octet-stream' --data-binary @"$W/backup.db" "http://127.0.0.1:8000/admin/restore?dry_run=true" | grep -q '"institutions":1'
          curl -fs -b "$J" -X POST -H 'Content-Type: application/octet-stream' --data-binary @"$W/backup.db" "http://127.0.0.1:8000/admin/restore" | grep -q '"restored":true'
          docker exec aa ls /data/backups | grep -q before-restore
          if docker logs aa 2>&1 | grep -iE 'traceback|error'; then echo 'the container logged an error'; exit 1; fi

  e2e:
    # Real-browser journeys: the built screen and the engine on one address, driven the way a person would.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm run build:app
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: node run.mjs
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: e2e/out
          if-no-files-found: ignore
