[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-academics"
version = "0.1.0"
description = "Constraint-based timetable generator for UG/PG programs in colleges and universities"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
